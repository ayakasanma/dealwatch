# 精簡版：只有 dealwatch，沒有瀏覽器容器。給記憶體小、跑不動 Chromium 的 NAS 用。
# 預設只監控不須瀏覽器的來源（排除 eBay 與 Micro Center）；Walmart 只用直接請求，被擋時會自動拉長間隔重試。
# 用法：docker compose -f docker-compose.lite.yml up -d
services:
  dealwatch:
    image: node:22-alpine
    container_name: dealwatch
    working_dir: /app
    command: ["node", "dealwatch.mjs", "ui", "--store", "bb,wm,wt,ne,sd,rd"]
    env_file: .env
    environment:
      - TZ=${TZ:-America/Chicago}
      - UI_PASSWORD=${UI_PASSWORD:?Set UI_PASSWORD in .env before starting}
      - UI_HOST=0.0.0.0
      - UI_PORT=8787
      - WALMART_VIA=http
    volumes:
      - ./:/app:ro
      - ./data:/app/data
    ports:
      - "${HOST_BIND_IP:-127.0.0.1}:${HOST_UI_PORT:-8787}:8787"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/healthz"]
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
